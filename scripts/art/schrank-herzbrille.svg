<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): heart glasses. Two hearts
       with a pink frame and rosy lenses that let Lumi's eyes shine through.
       The middle of the bridge is the middle of the picture.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-herzbrille.svg public/sprites/wardrobe/herzbrille.webp 384 -->
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fbf" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff4f8f" stop-opacity="0.62"/>
    </linearGradient>
    <path id="heart" d="M0 34 C-34 12 -52 -6 -52 -24 C-52 -40 -40 -50 -26 -50 C-14 -50 -4 -42 0 -32 C4 -42 14 -50 26 -50 C40 -50 52 -40 52 -24 C52 -6 34 12 0 34 Z"/>
  </defs>
  <!-- arms -->
  <path d="M14 112 L2 100" stroke="#7b4a1e" stroke-width="13" stroke-linecap="round"/>
  <path d="M14 112 L2 100" stroke="#ff4f8f" stroke-width="7" stroke-linecap="round"/>
  <path d="M242 112 L254 100" stroke="#7b4a1e" stroke-width="13" stroke-linecap="round"/>
  <path d="M242 112 L254 100" stroke="#ff4f8f" stroke-width="7" stroke-linecap="round"/>
  <!-- the bridge -->
  <path d="M108 118 Q128 104 148 118" stroke="#7b4a1e" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M108 118 Q128 104 148 118" stroke="#ff4f8f" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- frames: thick pink hearts -->
  <g transform="translate(66 128)">
    <use href="#heart" fill="none" stroke="#7b4a1e" stroke-width="22" stroke-linejoin="round"/>
    <use href="#heart" fill="url(#lens)" stroke="#ff4f8f" stroke-width="13" stroke-linejoin="round"/>
    <use href="#heart" fill="none" stroke="#7b4a1e" stroke-width="2.5" stroke-linejoin="round" transform="scale(0.82)"/>
  </g>
  <g transform="translate(190 128)">
    <use href="#heart" fill="none" stroke="#7b4a1e" stroke-width="22" stroke-linejoin="round"/>
    <use href="#heart" fill="url(#lens)" stroke="#ff4f8f" stroke-width="13" stroke-linejoin="round"/>
    <use href="#heart" fill="none" stroke="#7b4a1e" stroke-width="2.5" stroke-linejoin="round" transform="scale(0.82)"/>
  </g>
  <!-- shine -->
  <path d="M36 98 Q44 90 54 92" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M160 98 Q168 90 178 92" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>
  <circle cx="90" cy="104" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="214" cy="104" r="4" fill="#ffffff" opacity="0.8"/>
</svg>
