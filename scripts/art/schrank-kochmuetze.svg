<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the chef's hat. A white puff
       like a little cloud on a pleated band.
       Drawn in Lumi's units: inside the group 1 = one pixel of Lumi's
       384 picture, (0, 0) = the top of Lumi's head (the head anchor).
       The puff is round shapes drawn twice: once with a double outline,
       then again without, so only the outline round the whole cloud stays.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-kochmuetze.svg public/sprites/wardrobe/kochmuetze.webp 384 -->
  <defs>
    <linearGradient id="puff" gradientUnits="userSpaceOnUse" x1="-40" y1="-92" x2="40" y2="30">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f6f8fc"/>
      <stop offset="1" stop-color="#dde4ef"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f1f4f9"/>
      <stop offset="1" stop-color="#d6deea"/>
    </linearGradient>
    <g id="cloud">
      <circle cx="-72" cy="-14" r="30"/><circle cx="-36" cy="-42" r="33"/><circle cx="8" cy="-50" r="35"/>
      <circle cx="50" cy="-38" r="33"/><circle cx="76" cy="-10" r="30"/><ellipse cx="2" cy="-8" rx="84" ry="34"/>
    </g>
  </defs>
  <g transform="translate(128 142) scale(1.15)">
    <!-- the puff -->
    <use href="#cloud" fill="url(#puff)" stroke="#7b4a1e" stroke-width="9"/>
    <use href="#cloud" fill="url(#puff)"/>
    <!-- soft folds between the puffs -->
    <g stroke="#c3cddc" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-56 -26 Q-50 -16 -48 -4"/><path d="M-14 -34 Q-12 -22 -12 -10"/><path d="M28 -30 Q30 -18 30 -8"/><path d="M60 -20 Q62 -10 60 0"/>
    </g>
    <path d="M-80 -26 C-80 -40 -66 -50 -54 -50" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M-16 -66 C-8 -76 10 -80 22 -76" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- the pleated band -->
    <path d="M-96 18 Q0 4 96 18 L94 54 Q0 68 -94 54 Z" fill="url(#band)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <g stroke="#c3cddc" stroke-width="3" stroke-linecap="round">
      <path d="M-72 16 L-71 58"/><path d="M-44 13 L-44 61"/><path d="M-22 12 L-22 63"/><path d="M0 11 L0 64"/>
      <path d="M22 12 L22 63"/><path d="M44 13 L44 61"/><path d="M72 16 L71 58"/>
    </g>
    <path d="M-80 24 Q0 12 80 24" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
