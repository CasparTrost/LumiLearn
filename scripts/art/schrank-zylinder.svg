<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the top hat. A small dark
       top hat perched on the head, a red band with a bow, the brim curled
       up at the sides.
       Drawn in Lumi's units: inside the group 1 = one pixel of Lumi's
       384 picture, (0, 0) = the top of Lumi's head (the head anchor).
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-zylinder.svg public/sprites/wardrobe/zylinder.webp 384 -->
  <defs>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a6684"/>
      <stop offset="0.45" stop-color="#3a4462"/>
      <stop offset="1" stop-color="#252c42"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5574"/>
      <stop offset="1" stop-color="#262d44"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a5a"/>
      <stop offset="1" stop-color="#d0342e"/>
    </linearGradient>
  </defs>
  <g transform="translate(128 172) scale(1.3)">
    <!-- the tall crown, a little wider at the top -->
    <path d="M-50 4 L-56 -82 Q0 -90 56 -82 L50 4 Z" fill="url(#silk)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-82" rx="56" ry="9" fill="#6a7698" stroke="#7b4a1e" stroke-width="4.5"/>
    <path d="M-38 -66 L-36 -26" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.3"/>
    <!-- the red band and its bow -->
    <path d="M-52 -22 Q0 -14 52 -22 L51 -4 Q0 4 -51 -4 Z" fill="url(#band)" stroke="#7b4a1e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-46 -16 Q-10 -11 10 -11" stroke="#ff9e8e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g fill="url(#band)" stroke="#7b4a1e" stroke-width="3.5" stroke-linejoin="round">
      <path d="M30 -12 C24 -24 14 -24 14 -14 C14 -4 24 -2 30 -10 Z"/>
      <path d="M30 -12 C36 -24 46 -22 46 -14 C46 -4 36 -2 30 -10 Z"/>
      <circle cx="30" cy="-11" r="4.5"/>
    </g>
    <!-- the brim, curled up at the sides -->
    <path d="M-80 2 C-84 -8 -72 -12 -56 -6 Q0 6 56 -6 C72 -12 84 -8 80 2 C76 16 40 22 0 22 C-40 22 -76 16 -80 2 Z" fill="url(#brim)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-68 4 C-50 10 -26 12 -4 12" stroke="#7a88aa" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
