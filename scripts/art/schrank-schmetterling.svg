    <radialGradient id="lo" cx="0.5" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffc0dc"/><stop offset="1" stop-color="#ff6fa8"/></radialGradient>
  </defs>
  <g stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round">
