<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the sailor's cap. A soft white
       flat cap on a navy band with a gold anchor, two navy ribbons
       fluttering out at the side.
       Drawn in Lumi's units: inside the group 1 = one pixel of Lumi's
       384 picture, (0, 0) = the top of Lumi's head (the head anchor).
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-matrosenmuetze.svg public/sprites/wardrobe/matrosenmuetze.webp 384 -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f3f6fb"/>
      <stop offset="1" stop-color="#d3dcea"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a6cc0"/>
      <stop offset="1" stop-color="#22397a"/>
    </linearGradient>
    <clipPath id="body"><path d="M-102 26 C-116 0 -100 -28 -62 -38 C-24 -46 24 -46 62 -38 C100 -28 116 0 102 26 Z"/></clipPath>
  </defs>
  <g transform="translate(108 108) scale(0.92)">
    <!-- the two ribbons, behind, fluttering out to the right -->
    <g stroke="#7b4a1e" stroke-width="4" stroke-linejoin="round" fill="url(#navy)">
      <path d="M76 24 C108 24 134 34 154 52 L166 70 L152 68 L148 82 C130 60 106 48 74 42 Z"/>
      <path d="M70 32 C100 40 122 56 138 80 L144 100 L132 92 L122 102 C112 78 94 60 66 50 Z"/>
    </g>
    <path d="M86 32 C110 36 130 46 146 60" stroke="#6f8fe0" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- the soft white cap -->
    <path d="M-102 26 C-116 0 -100 -28 -62 -38 C-24 -46 24 -46 62 -38 C100 -28 116 0 102 26 Z" fill="url(#cap)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <g clip-path="url(#body)">
      <path d="M-96 -2 C-60 -22 60 -22 96 -2" stroke="#c3cddc" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-70 -28 C-40 -38 -10 -40 12 -40" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M104 30 C110 0 90 -24 60 -36 L130 -50 L130 30 Z" fill="#5a6c8c" opacity="0.18"/>
    </g>
    <!-- the navy band with a white line and a gold anchor -->
    <path d="M-96 16 Q0 2 96 16 L94 50 Q0 64 -94 50 Z" fill="url(#navy)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-92 24 Q0 10 92 24" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#7b4a1e" stroke-width="8">
        <circle cx="0" cy="25" r="4"/><path d="M0 29 L0 51 M-8 34 L8 34 M-13 42 Q-11 52 0 52 Q11 52 13 42"/>
      </g>
      <g stroke="#ffcf3a" stroke-width="4">
        <circle cx="0" cy="25" r="4"/><path d="M0 29 L0 51 M-8 34 L8 34 M-13 42 Q-11 52 0 52 Q11 52 13 42"/>
      </g>
    </g>
  </g>
</svg>
