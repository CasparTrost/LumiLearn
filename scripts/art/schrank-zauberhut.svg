<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the wizard hat. A deep blue
       cone whose tip flops over to the side, gold stars and a moon, a wide
       brim and a yellow band.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-zauberhut.svg public/sprites/wardrobe/zauberhut.webp 256 -->
  <defs>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d6bff"/>
      <stop offset="0.55" stop-color="#5a46d8"/>
      <stop offset="1" stop-color="#3e2ea8"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c58ee"/>
      <stop offset="1" stop-color="#3a2a9c"/>
    </linearGradient>
    <clipPath id="c"><path d="M66 190 C86 150 98 96 116 62 C124 46 140 30 164 22 C190 14 212 26 214 44 C200 36 182 40 170 54 C158 70 160 130 190 190 Z"/></clipPath>
  </defs>
  <g stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- the cone, its tip bent over to the right -->
    <path d="M66 190 C86 150 98 96 116 62 C124 46 140 30 164 22 C190 14 212 26 214 44 C200 36 182 40 170 54 C158 70 160 130 190 190 Z" fill="url(#cone)"/>
  </g>
  <g clip-path="url(#c)">
    <path d="M96 176 C104 140 114 96 128 66" stroke="#ffffff" stroke-width="10" opacity="0.22" fill="none" stroke-linecap="round"/>
    <path d="M190 190 C160 130 158 70 170 54 L240 40 L240 200 Z" fill="#1e1460" opacity="0.2"/>
  </g>
  <!-- a tiny star dangling from the tip -->
  <path d="M214 44 L214 58" stroke="#7b4a1e" stroke-width="3"/>
  <path d="M214 56 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1 z" fill="#ffd23a" stroke="#7b4a1e" stroke-width="3" stroke-linejoin="round"/>
  <!-- stars and a moon on the cone -->
  <path d="M120 120 l5 10 11 1 -8 8 2 11 -10 -5 -10 5 2 -11 -8 -8 11 -1 z" fill="#ffd23a" stroke="#7b4a1e" stroke-width="3" stroke-linejoin="round"/>
  <path d="M150 82 l3 6 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1 z" fill="#fff1a8" stroke="#7b4a1e" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M146 150 a14 14 0 1 0 14 20 a11 11 0 1 1 -14 -20 z" fill="#fff1a8" stroke="#7b4a1e" stroke-width="3" stroke-linejoin="round"/>
  <!-- the band -->
  <path d="M74 172 Q128 160 182 172 L188 192 Q128 180 68 192 Z" fill="#ffd23a" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- the wide brim -->
  <path d="M16 200 C30 182 78 180 128 180 C178 180 226 182 240 200 C232 222 180 228 128 228 C76 228 24 222 16 200 Z" fill="url(#brim)" stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round"/>
  <path d="M34 198 C60 188 100 186 128 186" stroke="#9c8cff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>
