<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe/head.js): the wizard hat. A deep
       blue cone, short and wide, whose soft tip flops over to the side and
       hangs down with a little star on it; gold stars and a moon, a wide
       brim and a yellow band. Low enough that Lumi keeps its size.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-zauberhut.svg public/sprites/wardrobe/zauberhut.webp 384 -->
  <defs>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d6bff"/>
      <stop offset="0.55" stop-color="#5a46d8"/>
      <stop offset="1" stop-color="#3e2ea8"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c58ee"/>
      <stop offset="1" stop-color="#3a2a9c"/>
    </linearGradient>
    <clipPath id="c"><path d="M64 190 C76 150 94 116 116 98 C134 84 162 80 186 92 C204 102 214 124 210 146 C200 130 186 122 174 124 C164 140 172 168 192 190 Z"/></clipPath>
  </defs>
  <!-- the cone: wide and low, its tip bent over to the right and hanging down -->
  <path d="M64 190 C76 150 94 116 116 98 C134 84 162 80 186 92 C204 102 214 124 210 146 C200 130 186 122 174 124 C164 140 172 168 192 190 Z" fill="url(#cone)" stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round"/>
  <g clip-path="url(#c)">
    <path d="M92 180 C100 148 114 120 134 104" stroke="#ffffff" stroke-width="10" opacity="0.22" fill="none" stroke-linecap="round"/>
    <path d="M192 190 C172 168 164 140 174 124 L240 110 L240 200 Z" fill="#1e1460" opacity="0.2"/>
  </g>
  <!-- the little star at the hanging tip -->
  <path d="M210 146 L212 156" stroke="#7b4a1e" stroke-width="3"/>
  <path d="M212 152 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1 z" fill="#ffd23a" stroke="#7b4a1e" stroke-width="3" stroke-linejoin="round"/>
  <!-- stars and a moon on the cone -->
  <path d="M110 136 l5 10 11 1 -8 8 2 11 -10 -5 -10 5 2 -11 -8 -8 11 -1 z" fill="#ffd23a" stroke="#7b4a1e" stroke-width="3" stroke-linejoin="round"/>
  <path d="M146 100 l3 6 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1 z" fill="#fff1a8" stroke="#7b4a1e" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M150 140 a12 12 0 1 0 12 18 a9.5 9.5 0 1 1 -12 -18 z" fill="#fff1a8" stroke="#7b4a1e" stroke-width="3" stroke-linejoin="round"/>
  <!-- the band -->
  <path d="M72 172 Q128 160 184 172 L190 192 Q128 180 66 192 Z" fill="#ffd23a" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- the wide brim -->
  <path d="M16 200 C30 182 78 180 128 180 C178 180 226 182 240 200 C232 222 180 228 128 228 C76 228 24 222 16 200 Z" fill="url(#brim)" stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round"/>
  <path d="M34 198 C60 188 100 186 128 186" stroke="#9c8cff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>
