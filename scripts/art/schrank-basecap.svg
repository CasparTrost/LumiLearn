<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the baseball cap. Green, with
       seams, little air holes and a button on top; the peak points out to
       the side (as children wear it), so it reads as a peak from the front.
       Drawn in Lumi's units: inside the group 1 = one pixel of Lumi's
       384 picture, (0, 0) = the top of Lumi's head (the head anchor).
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-basecap.svg public/sprites/wardrobe/basecap.webp 384 -->
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee08e"/>
      <stop offset="0.5" stop-color="#3fbf62"/>
      <stop offset="1" stop-color="#2a9448"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46c467"/>
      <stop offset="1" stop-color="#25803e"/>
    </linearGradient>
    <clipPath id="dome"><path d="M-96 46 C-102 -6 -60 -58 2 -58 C64 -58 102 -8 96 46 Q0 64 -96 46 Z"/></clipPath>
  </defs>
  <g transform="translate(162 128) scale(0.86)">
    <!-- the dome -->
    <path d="M-96 46 C-102 -6 -60 -58 2 -58 C64 -58 102 -8 96 46 Q0 64 -96 46 Z" fill="url(#cap)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <g clip-path="url(#dome)">
      <!-- the seams and their stitching -->
      <path d="M2 -58 Q-34 -16 -42 60 M2 -58 Q38 -16 46 60" stroke="#24803c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M-10 -40 Q-34 -6 -38 50 M14 -40 Q38 -6 42 50" stroke="#c8f5cf" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.8"/>
      <!-- light and shade -->
      <path d="M-74 10 C-70 -20 -52 -40 -28 -50" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.35"/>
      <path d="M96 56 C98 0 72 -40 30 -58 L120 -70 L120 56 Z" fill="#0e4a1e" opacity="0.2"/>
    </g>
    <!-- air holes -->
    <g fill="#2a8a44" stroke="#7b4a1e" stroke-width="2"><circle cx="-36" cy="-20" r="3.5"/><circle cx="42" cy="-20" r="3.5"/></g>
    <!-- the button on top -->
    <ellipse cx="2" cy="-60" rx="9" ry="6" fill="#3fbf62" stroke="#7b4a1e" stroke-width="4"/>
    <!-- the peak, out to the left -->
    <path d="M-56 34 C-96 24 -146 28 -174 50 C-170 62 -150 66 -120 62 C-96 60 -76 58 -58 56 Z" fill="url(#peak)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-66 42 C-100 36 -138 38 -160 50" stroke="#b6f0c0" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 5"/>
    <path d="M-74 38 C-104 32 -140 34 -164 46" stroke="#8fe3a0" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
