<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- The source of public/sprites/emoji/custom/waschmaschine.webp ("Waschmaschine"):
       a white front loader, washing turning behind the round door.
       Render: scripts/art/render-svg.mjs -->
  <defs>
    <clipPath id="glass"><circle cx="128" cy="150" r="46"/></clipPath>
  </defs>
  <g stroke="#2a1b3d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- feet -->
    <rect x="50" y="222" width="26" height="18" rx="4" fill="#4a4556"/>
    <rect x="180" y="222" width="26" height="18" rx="4" fill="#4a4556"/>
    <!-- the cabinet -->
    <rect x="34" y="18" width="188" height="214" rx="18" fill="#f5f7fa"/>
