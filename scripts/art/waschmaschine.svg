    <path d="M96 166 Q104 148 122 154 Q128 170 112 178 Q100 182 96 166 Z" fill="#ff6b8a" stroke="#2a1b3d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M130 152 L144 142 L154 148 L164 142 L178 152 L172 164 L166 160 L166 184 L142 184 L142 160 L136 164 Z" fill="#ffd21f" stroke="#2a1b3d" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="112" cy="124" r="5" fill="#bfe6fb"/>
    <circle cx="146" cy="132" r="4" fill="#bfe6fb"/>
