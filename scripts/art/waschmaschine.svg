    <!-- the door: chrome ring and glass -->
    <circle cx="128" cy="150" r="64" fill="#c7cfd9"/>
    <circle cx="128" cy="150" r="46" fill="#5fb8ec"/>
  </g>
  <!-- the dial's pointer and the lamps -->
  <path d="M186 45 L186 32" stroke="#2a1b3d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="132" cy="46" r="6" fill="#3fc35a" stroke="#2a1b3d" stroke-width="3"/>
  <circle cx="152" cy="46" r="6" fill="#f2b32a" stroke="#2a1b3d" stroke-width="3"/>
