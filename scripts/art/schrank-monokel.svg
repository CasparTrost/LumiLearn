<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the monocle. One round clear
       lens in a gold rim on Lumi's right eye (on the left of the picture),
       a little gold chain swinging down beside the cheek. The middle
       between the eyes is the middle of the picture.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-monokel.svg public/sprites/wardrobe/monokel.webp 384 -->
  <defs>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e6f4ff" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <!-- the chain: from the rim down and out, then curling back in -->
  <path d="M30 150 C8 176 10 214 36 232 C50 242 66 240 74 228" fill="none" stroke="#7b4a1e" stroke-width="10" stroke-linecap="round" stroke-dasharray="0.1 11"/>
  <path d="M30 150 C8 176 10 214 36 232 C50 242 66 240 74 228" fill="none" stroke="#ffc93a" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 11"/>
  <!-- the rim -->
  <circle cx="64" cy="128" r="44" fill="url(#glass)" stroke="#7b4a1e" stroke-width="16"/>
  <circle cx="64" cy="128" r="44" fill="none" stroke="#f2b51e" stroke-width="9"/>
  <!-- the little ring for the chain -->
  <circle cx="28" cy="154" r="7" fill="none" stroke="#7b4a1e" stroke-width="8"/>
  <circle cx="28" cy="154" r="7" fill="none" stroke="#ffc93a" stroke-width="3.5"/>
  <!-- light on the rim and a glint on the glass -->
  <path d="M30 112 A38 38 0 0 1 56 88" stroke="#fff0a8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M40 120 L56 104" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <path d="M74 158 L90 144" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
</svg>
