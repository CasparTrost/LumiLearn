<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the fire helmet. A shiny red
       helmet with a gold comb over the top, a yellow stripe, a gold shield
       with a little flame in front and a brim all round.
       Drawn in Lumi's units: inside the group 1 = one pixel of Lumi's
       384 picture, (0, 0) = the top of Lumi's head (the head anchor).
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-feuerwehrhelm.svg public/sprites/wardrobe/feuerwehrhelm.webp 384 -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7464"/>
      <stop offset="0.5" stop-color="#e8382c"/>
      <stop offset="1" stop-color="#b42420"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2362b"/>
      <stop offset="1" stop-color="#a61f1c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="0.5" stop-color="#ffcf3a"/>
      <stop offset="1" stop-color="#e09a1c"/>
    </linearGradient>
    <clipPath id="dome"><path d="M-96 42 C-98 -12 -56 -56 0 -56 C56 -56 98 -12 96 42 Z"/></clipPath>
  </defs>
  <g transform="translate(128 130) scale(1.05)">
    <!-- the dome -->
    <path d="M-96 42 C-98 -12 -56 -56 0 -56 C56 -56 98 -12 96 42 Z" fill="url(#red)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <g clip-path="url(#dome)">
      <!-- the yellow stripe round the helmet -->
      <path d="M-110 16 Q0 -4 110 16 L110 30 Q0 10 -110 30 Z" fill="#ffe14d"/>
      <path d="M-110 16 Q0 -4 110 16 M110 30 Q0 10 -110 30" stroke="#7b4a1e" stroke-width="3" fill="none"/>
      <!-- light on the upper left, shade on the right -->
      <path d="M-74 -4 C-68 -28 -50 -42 -30 -48" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path d="M96 50 C96 0 70 -40 30 -56 L120 -70 L120 50 Z" fill="#6e1010" opacity="0.2"/>
    </g>
    <!-- the gold comb over the top -->
    <path d="M-11 0 L-11 -52 C-11 -68 11 -68 11 -52 L11 0 Z" fill="url(#gold)" stroke="#7b4a1e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-4 -54 L-4 -10" stroke="#fffbe0" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- the gold shield with a flame -->
    <path d="M0 -14 L24 -6 C24 14 15 26 0 34 C-15 26 -24 14 -24 -6 Z" fill="url(#gold)" stroke="#7b4a1e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 24 C-9 24 -12 16 -10 10 C-8 4 -4 2 -3 -4 C2 0 3 4 3 8 C5 6 6 4 6 2 C10 8 11 14 8 19 C6 22 3 24 0 24 Z" fill="#ff7a2a" stroke="#c0441a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M0 22 C-4 22 -5 18 -4 15 C-3 12 0 11 0 8 C4 12 5 16 3 19 C2 21 1 22 0 22 Z" fill="#ffe14d"/>
    <!-- the brim all round -->
    <path d="M-118 34 C-60 22 60 22 118 34 C124 44 118 56 108 58 C60 66 -60 66 -108 58 C-118 56 -124 44 -118 34 Z" fill="url(#brim)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-104 38 C-60 30 -20 29 10 30" stroke="#ff8a7a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
