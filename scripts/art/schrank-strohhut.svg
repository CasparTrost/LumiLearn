<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the straw hat. A pale woven
       sun hat with a wide round brim, a sky-blue ribbon and a pink flower.
       Drawn in Lumi's units: inside the group 1 = one pixel of Lumi's
       384 picture, (0, 0) = the top of Lumi's head (the head anchor).
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-strohhut.svg public/sprites/wardrobe/strohhut.webp 384 -->
  <defs>
    <linearGradient id="straw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe9b8"/>
      <stop offset="0.55" stop-color="#efcf86"/>
      <stop offset="1" stop-color="#d4a654"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cd0ff"/>
      <stop offset="1" stop-color="#3a9ee0"/>
    </linearGradient>
    <radialGradient id="pink" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffd0e2"/><stop offset="1" stop-color="#ff6f9e"/></radialGradient>
    <radialGradient id="mid" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#f0a020"/></radialGradient>
    <clipPath id="brim"><path d="M-142 22 C-142 -6 -80 -12 0 -12 C80 -12 142 -6 142 22 C142 48 80 60 0 60 C-80 60 -142 48 -142 22 Z"/></clipPath>
    <clipPath id="crown"><path d="M-64 22 C-68 -34 -40 -60 0 -60 C40 -60 68 -34 64 22 Q0 40 -64 22 Z"/></clipPath>
  </defs>
  <g transform="translate(128 128) scale(0.86)">
    <!-- the wide round brim -->
    <path d="M-142 22 C-142 -6 -80 -12 0 -12 C80 -12 142 -6 142 22 C142 48 80 60 0 60 C-80 60 -142 48 -142 22 Z" fill="url(#straw)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <g clip-path="url(#brim)" fill="none" stroke-linecap="round">
      <!-- woven rings -->
      <g stroke="#c9963e" stroke-width="2.5" opacity="0.75">
        <ellipse cx="0" cy="24" rx="124" ry="28"/><ellipse cx="0" cy="24" rx="104" ry="22"/><ellipse cx="0" cy="24" rx="84" ry="17"/>
      </g>
      <path d="M-128 34 C-110 46 -70 54 -20 55" stroke="#fff6d6" stroke-width="5" opacity="0.8"/>
    </g>
    <!-- the crown -->
    <path d="M-64 22 C-68 -34 -40 -60 0 -60 C40 -60 68 -34 64 22 Q0 40 -64 22 Z" fill="url(#straw)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <g clip-path="url(#crown)" fill="none" stroke-linecap="round">
      <g stroke="#c9963e" stroke-width="2.5" opacity="0.75">
        <path d="M-70 -20 Q0 -36 70 -20"/><path d="M-70 -40 Q0 -54 70 -40"/>
        <path d="M-40 -60 L-46 30 M-16 -64 L-18 34 M16 -64 L18 34 M40 -60 L46 30" stroke-dasharray="3 6"/>
      </g>
      <path d="M-48 -8 C-48 -30 -36 -46 -18 -52" stroke="#ffffff" stroke-width="8" opacity="0.45"/>
      <path d="M64 30 C66 -10 54 -40 30 -58 L90 -70 L90 30 Z" fill="#9a6a20" stroke="none" opacity="0.2"/>
    </g>
    <!-- the sky-blue ribbon -->
    <path d="M-65 4 Q0 20 65 4 L64 22 Q0 40 -64 22 Z" fill="url(#ribbon)" stroke="#7b4a1e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-56 9 Q-20 18 0 18" stroke="#c4ecff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- a pink flower on the ribbon -->
    <g transform="translate(40 18)" stroke="#7b4a1e" stroke-width="3" stroke-linejoin="round" fill="url(#pink)">
      <circle cx="0" cy="-11" r="9"/><circle cx="10.5" cy="-3.4" r="9"/><circle cx="6.5" cy="8.9" r="9"/>
      <circle cx="-6.5" cy="8.9" r="9"/><circle cx="-10.5" cy="-3.4" r="9"/>
      <circle cx="0" cy="0" r="6.5" fill="url(#mid)"/>
    </g>
  </g>
</svg>
