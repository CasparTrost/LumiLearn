<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the pirate hat. A friendly
       black tricorn with a gold edge and a smiling white skull, a red
       feather tucked in on the side. Seen from the front.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-piratenhut.svg public/sprites/wardrobe/piratenhut.webp 256 -->
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4058"/>
      <stop offset="1" stop-color="#2a2236"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55496a"/>
      <stop offset="1" stop-color="#2e263c"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a6a"/><stop offset="1" stop-color="#d63a3a"/></linearGradient>
  </defs>
  <!-- the feather, behind the hat on the right -->
  <path d="M176 120 C196 70 232 46 246 40 C240 70 220 108 186 132 Z" fill="url(#feather)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M184 126 C204 96 226 66 242 46" stroke="#a82a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- the crown of the hat -->
    <path d="M70 160 C68 100 96 70 128 70 C160 70 188 100 186 160 Z" fill="url(#crown)"/>
    <!-- the turned-up brim: high in the middle, swept up at both ends -->
    <path d="M14 128 C40 150 70 158 92 146 C104 116 152 116 164 146 C186 158 216 150 242 128 C238 168 214 198 176 204 Q128 214 80 204 C42 198 18 168 14 128 Z" fill="url(#felt)"/>
  </g>
  <!-- gold trim along the brim's edge -->
  <path d="M20 136 C44 156 72 164 94 152 C106 124 150 124 162 152 C184 164 212 156 236 136" stroke="#ffc93c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the skull, round and friendly -->
  <g stroke="#7b4a1e" stroke-width="3.5" stroke-linejoin="round">
    <path d="M110 186 L146 166 M110 166 L146 186" stroke="#fff7ea" stroke-width="7" stroke-linecap="round"/>
    <path d="M110 186 L146 166 M110 166 L146 186" stroke="#7b4a1e" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M128 140 C142 140 150 150 150 160 C150 168 144 172 140 174 L140 180 L116 180 L116 174 C112 172 106 168 106 160 C106 150 114 140 128 140 Z" fill="#fff7ea"/>
  </g>
  <ellipse cx="120" cy="160" rx="5" ry="6" fill="#2a2236"/>
  <ellipse cx="136" cy="160" rx="5" ry="6" fill="#2a2236"/>
  <path d="M121 172 Q128 176 135 172" stroke="#2a2236" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- light on the felt -->
  <path d="M88 132 C88 104 104 86 122 80" stroke="#8a7aa6" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M32 150 C44 170 58 182 76 188" stroke="#6a5c84" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>
