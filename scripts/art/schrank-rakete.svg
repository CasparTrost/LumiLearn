<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe/back.js): the rocket backpack. Two
       little white rockets with red tips and fins on a strap, one left and
       one right of Lumi, soft flames below. Drawn behind Lumi; the middle
       of the strap is between the shoulders.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-rakete.svg public/sprites/wardrobe/rakete.webp 384 -->
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd8e6"/></linearGradient>
    <radialGradient id="f" cx="0.5" cy="0.2" r="0.9"><stop offset="0" stop-color="#fff6a8"/><stop offset="0.5" stop-color="#ffb43a"/><stop offset="1" stop-color="#ff6a3a"/></radialGradient>
    <g id="rocket">
      <path d="M-12 168 C-22 190 -8 214 0 226 C8 214 22 190 12 168 Z" fill="url(#f)" stroke="#e0622e" stroke-width="3" stroke-linejoin="round"/>
      <g stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round">
        <path d="M-22 120 L-36 166 L-16 160 Z" fill="#e5483f"/>
        <path d="M22 120 L36 166 L16 160 Z" fill="#e5483f"/>
        <path d="M0 50 C18 66 24 96 22 166 L-22 166 C-24 96 -18 66 0 50 Z" fill="url(#b)"/>
        <path d="M0 50 C10 58 15 68 18 80 L-18 80 C-15 68 -10 58 0 50 Z" fill="#e5483f"/>
        <circle cx="0" cy="110" r="10" fill="#7fd0ff"/>
      </g>
      <path d="M-12 96 L-12 150" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>
  <!-- the strap between them -->
  <path d="M34 124 Q128 104 222 124" stroke="#7b4a1e" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M34 124 Q128 104 222 124" stroke="#4aa3ff" stroke-width="9" fill="none" stroke-linecap="round"/>
  <use href="#rocket" transform="translate(34 0)"/>
  <use href="#rocket" transform="translate(222 0)"/>
</svg>
