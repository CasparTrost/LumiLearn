<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the bobble hat. A knitted red
       hat with two cream stripes, a ribbed cuff and a fluffy bobble.
       Drawn in the soft style of Lumi's pictures: warm brown outline,
       light from the upper left.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-muetze.svg public/sprites/wardrobe/muetze.webp 256 -->
  <defs>
    <linearGradient id="knit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a68"/>
      <stop offset="0.55" stop-color="#ec4d40"/>
      <stop offset="1" stop-color="#c93a31"/>
    </linearGradient>
    <linearGradient id="cuff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5483f"/>
      <stop offset="1" stop-color="#b8322c"/>
    </linearGradient>
    <radialGradient id="bob" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.7" stop-color="#fbeccc"/>
      <stop offset="1" stop-color="#e9cf9e"/>
    </radialGradient>
    <clipPath id="dome"><path d="M38 176 C34 126 78 98 128 98 C178 98 222 126 218 176 Z"/></clipPath>
  </defs>
  <g stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- the knitted dome -->
    <path d="M38 176 C34 126 78 98 128 98 C178 98 222 126 218 176 Z" fill="url(#knit)"/>
  </g>
  <!-- cream stripes, knitted into the dome -->
  <g clip-path="url(#dome)">
    <path d="M20 132 Q128 112 236 132 L236 144 Q128 124 20 144 Z" fill="#fff1d2"/>
    <path d="M20 154 Q128 134 236 154 L236 165 Q128 145 20 165 Z" fill="#fff1d2"/>
    <!-- knit ribs -->
    <g stroke="#b8322c" stroke-width="2.5" fill="none" opacity="0.45" stroke-linecap="round">
      <path d="M80 110 Q68 140 66 176"/><path d="M104 102 Q96 136 98 176"/><path d="M128 99 L128 176"/>
      <path d="M152 102 Q160 136 158 176"/><path d="M176 110 Q188 140 190 176"/>
    </g>
    <!-- light on the upper left, shade on the right -->
    <path d="M58 158 Q64 120 104 104" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.35"/>
    <path d="M208 176 Q214 130 176 106 L230 90 L240 180 Z" fill="#7b2a20" opacity="0.18"/>
  </g>
  <path d="M38 176 C34 126 78 98 128 98 C178 98 222 126 218 176 Z" fill="none" stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round"/>
  <!-- the ribbed cuff, curving round the forehead -->
  <path d="M28 168 Q128 150 228 168 L232 200 Q128 222 24 200 Z" fill="url(#cuff)" stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round"/>
  <g stroke="#8f2a25" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M44 168 L42 199"/><path d="M62 165 L61 203"/><path d="M80 162 L80 206"/><path d="M98 160 L98 208"/>
    <path d="M116 159 L116 209"/><path d="M134 159 L134 209"/><path d="M152 160 L152 208"/><path d="M170 161 L170 207"/>
    <path d="M188 163 L189 204"/><path d="M206 166 L207 201"/>
  </g>
  <path d="M40 172 Q128 156 216 172" stroke="#ff8f80" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- the bobble: a fluffy ball -->
  <g stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round">
    <path transform="translate(0 30)" d="M128 18 C140 14 150 22 156 28 C166 30 170 40 168 48 C176 56 172 68 164 72 C162 82 150 86 142 82 C134 90 120 90 114 82 C104 86 92 80 92 70 C84 64 84 52 92 46 C90 36 98 28 108 28 C112 20 120 16 128 18 Z" fill="url(#bob)"/>
  </g>
  <g stroke="#d8b77e" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" transform="translate(0 30)">
    <path d="M110 44 l6 6"/><path d="M140 38 l-4 7"/><path d="M150 60 l-7 2"/><path d="M118 66 l4 -6"/><path d="M132 54 l0 6"/>
  </g>
</svg>
