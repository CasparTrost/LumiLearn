<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the neckerchief (a bandana).
       Red with white dots and a white stitched edge: a rolled band round
       the neck and the triangle hanging down on the chest, tied behind.
       The middle of the upper edge is the neck.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-halstuch.svg public/sprites/wardrobe/halstuch.webp 384 -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5d4f"/>
      <stop offset="1" stop-color="#d43434"/>
    </linearGradient>
    <clipPath id="cloth"><path d="M44 52 C80 70 176 70 212 52 C204 98 168 150 132 196 Q128 202 124 196 C88 150 52 98 44 52 Z"/></clipPath>
  </defs>
  <!-- the triangle on the chest -->
  <path d="M44 52 C80 70 176 70 212 52 C204 98 168 150 132 196 Q128 202 124 196 C88 150 52 98 44 52 Z" fill="url(#red)"/>
  <g clip-path="url(#cloth)" fill="#fff4e4">
    <circle cx="74" cy="86" r="7"/><circle cx="104" cy="96" r="7"/><circle cx="152" cy="96" r="7"/><circle cx="182" cy="86" r="7"/>
    <circle cx="90" cy="120" r="7"/><circle cx="128" cy="116" r="7"/><circle cx="166" cy="120" r="7"/>
    <circle cx="110" cy="146" r="7"/><circle cx="146" cy="146" r="7"/><circle cx="128" cy="174" r="6"/>
    <path d="M128 70 C150 110 160 140 132 200 L230 200 L230 40 Z" fill="#7a1a20" opacity="0.15"/>
  </g>
  <!-- the stitched edge -->
  <path d="M58 70 C88 112 104 136 128 178 C152 136 168 112 198 70" fill="none" stroke="#fff4e4" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
  <path d="M44 52 C80 70 176 70 212 52 C204 98 168 150 132 196 Q128 202 124 196 C88 150 52 98 44 52 Z" fill="none" stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round"/>
  <!-- the rolled band round the neck -->
  <path d="M24 30 C70 54 186 54 232 30 C240 42 236 58 222 64 C180 80 76 80 34 64 C20 58 16 42 24 30 Z" fill="url(#red)" stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round"/>
  <path d="M60 58 C96 70 160 70 196 58" stroke="#a82a2a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <circle cx="64" cy="50" r="5" fill="#fff4e4"/><circle cx="104" cy="58" r="5" fill="#fff4e4"/><circle cx="152" cy="58" r="5" fill="#fff4e4"/><circle cx="192" cy="50" r="5" fill="#fff4e4"/>
  <path d="M36 40 C70 58 186 58 220 40" stroke="#ffb0a4" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>
