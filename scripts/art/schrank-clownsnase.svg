<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the clown nose. A shiny round
       red ball that sits on Lumi's beak. The middle of the ball is the
       middle of the picture (it is drawn small: see `dy` in face.js).
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-clownsnase.svg public/sprites/wardrobe/clownsnase.webp 384 -->
  <defs>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="0.45" stop-color="#ee3a3a"/>
      <stop offset="1" stop-color="#b81c2a"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="108" fill="url(#ball)" stroke="#7b4a1e" stroke-width="13"/>
  <!-- a soft shadow at the bottom, the shine at the top -->
  <path d="M40 160 C60 214 196 214 216 160 C200 200 150 222 128 222 C106 222 56 200 40 160 Z" fill="#7a1220" opacity="0.25"/>
  <ellipse cx="88" cy="80" rx="34" ry="22" transform="rotate(-30 88 80)" fill="#ffffff" opacity="0.85"/>
  <circle cx="140" cy="62" r="10" fill="#ffffff" opacity="0.7"/>
</svg>
