<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- The source of public/sprites/emoji/custom/feuerloescher.webp ("Feuerlöscher"):
       a red extinguisher with its valve, lever, gauge and black hose.
       Render: scripts/art/render-svg.mjs -->
  <g stroke="#2a1b3d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- the hose, from the valve round to the nozzle at the side -->
    <path d="M150 50 C204 52 214 110 204 176" fill="none" stroke-width="20"/>
    <path d="M150 50 C204 52 214 110 204 176" fill="none" stroke="#3b3546" stroke-width="9"/>
    <path d="M194 170 L214 170 L218 214 Q209 220 200 214 Z" fill="#3b3546"/>
    <!-- the bottle -->
    <path d="M78 100 Q78 66 128 62 Q178 66 178 100 L178 218 Q178 232 164 232 L92 232 Q78 232 78 218 Z" fill="#e23b30"/>
    <!-- the neck and the valve -->
    <rect x="110" y="44" width="36" height="22" rx="4" fill="#4a4556"/>
    <rect x="98" y="30" width="60" height="20" rx="6" fill="#6b6578"/>
    <!-- the carrying handle and the lever above it -->
    <path d="M150 42 L196 48 L196 58 L150 52 Z" fill="#8b8597"/>
    <path d="M112 30 L120 18 L196 30 L192 40 Z" fill="#b1abbd"/>
    <!-- the pressure gauge -->
    <circle cx="86" cy="40" r="17" fill="#f6f4ee"/>
    <path d="M104 40 L98 40" stroke-width="6"/>
  </g>
  <!-- gauge: green field and needle -->
  <path d="M74 38 A13 13 0 0 1 98 38" stroke="#3fae5a" stroke-width="5" fill="none"/>
  <path d="M86 42 L94 32" stroke="#2a1b3d" stroke-width="3" stroke-linecap="round"/>
  <!-- the safety pin with its yellow ring -->
  <circle cx="130" cy="22" r="8" fill="none" stroke="#2a1b3d" stroke-width="8"/>
  <circle cx="130" cy="22" r="8" fill="none" stroke="#f5c518" stroke-width="4"/>
  <!-- shade on the right of the bottle -->
  <path d="M162 84 Q170 96 170 112 L170 218 Q170 225 162 226" stroke="#b42a22" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- the white label band -->
  <rect x="81" y="134" width="94" height="44" fill="#fbf7ef" stroke="#2a1b3d" stroke-width="5"/>
  <!-- a little flame on the label -->
  <path d="M128 168 C114 168 112 156 120 146 C121 152 124 154 126 152 C124 146 128 140 132 138 C132 146 142 150 138 162 C136 166 132 168 128 168 Z" fill="#f28a1e" stroke="#2a1b3d" stroke-width="3" stroke-linejoin="round"/>
  <!-- light on the left -->
  <path d="M96 92 Q92 104 92 120" stroke="#ff8f80" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M92 192 L92 214" stroke="#ff8f80" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>
