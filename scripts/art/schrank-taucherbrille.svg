<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): diving goggles. One wide
       mask with a soft turquoise rim, a clear watery lens over both eyes,
       a dip at the bottom for the beak, the strap to the sides and an
       orange snorkel standing up beside it. The middle between the eyes
       is the middle of the picture.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-taucherbrille.svg public/sprites/wardrobe/taucherbrille.webp 384 -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#bff0fa" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd6e6"/>
      <stop offset="1" stop-color="#1aa3b8"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb06a"/>
      <stop offset="0.5" stop-color="#ff7a2a"/>
      <stop offset="1" stop-color="#e2581a"/>
    </linearGradient>
  </defs>
  <!-- the strap, reaching back to the sides -->
  <path d="M20 116 L2 110 L2 140 L20 142" fill="#2c5a8c" stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round"/>
  <path d="M236 116 L254 110 L254 140 L236 142" fill="#2c5a8c" stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round"/>
  <!-- the snorkel, standing up on the right, held by a clip on the strap -->
  <path d="M236 214 C246 214 250 206 250 196 L250 40 C250 30 242 24 232 26" fill="none" stroke="#7b4a1e" stroke-width="22" stroke-linecap="round"/>
  <path d="M236 214 C246 214 250 206 250 196 L250 40 C250 30 242 24 232 26" fill="none" stroke="url(#tube)" stroke-width="13" stroke-linecap="round"/>
  <path d="M246 56 L246 186" stroke="#ffd2a8" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="238" y="118" width="24" height="16" rx="5" fill="#2c5a8c" stroke="#7b4a1e" stroke-width="4.5"/>
  <!-- the rim of the mask -->
  <path fill-rule="evenodd" d="M18 104 C18 78 40 70 70 70 L186 70 C216 70 238 78 238 104 L238 150 C238 176 218 188 190 188 C166 188 152 178 146 164 Q128 150 110 164 C104 178 90 188 66 188 C38 188 18 176 18 150 Z M34 108 C34 90 48 86 72 86 L184 86 C208 86 222 90 222 108 L222 146 C222 164 208 172 190 172 C172 172 162 164 156 152 Q128 132 100 152 C94 164 84 172 66 172 C48 172 34 164 34 146 Z" fill="url(#rim)" stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round"/>
  <!-- the lens -->
  <path d="M34 108 C34 90 48 86 72 86 L184 86 C208 86 222 90 222 108 L222 146 C222 164 208 172 190 172 C172 172 162 164 156 152 Q128 132 100 152 C94 164 84 172 66 172 C48 172 34 164 34 146 Z" fill="url(#glass)" stroke="#7b4a1e" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- light on the rim and on the glass -->
  <path d="M30 98 C34 82 50 78 72 78 L184 78" stroke="#b6f2fa" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M48 120 L70 98" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <path d="M60 128 L78 110" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M176 120 L198 98" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <!-- the mouth of the snorkel -->
  <ellipse cx="228" cy="26" rx="9" ry="11" fill="#ffe066" stroke="#7b4a1e" stroke-width="4.5"/>
</svg>
