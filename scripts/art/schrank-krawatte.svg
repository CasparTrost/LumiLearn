<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the tie. A blue tie with
       light blue stripes under a small white collar: the knot at the neck,
       the blade down the chest. The middle of the collar is the neck.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-krawatte.svg public/sprites/wardrobe/krawatte.webp 384 -->
  <defs>
    <pattern id="stripes" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width="22" height="22" fill="#3a6ee8"/>
      <rect width="22" height="7" fill="#8fc3ff"/>
    </pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#14306e" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <g stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round">
    <!-- the blade -->
    <path d="M116 62 L140 62 L160 186 L128 222 L96 186 Z" fill="url(#stripes)"/>
    <path d="M116 62 L140 62 L160 186 L128 222 L96 186 Z" fill="url(#shade)" stroke="none"/>
    <!-- the collar, two white points -->
    <path d="M128 40 L78 26 L88 66 L118 60 Z" fill="#ffffff"/>
    <path d="M128 40 L178 26 L168 66 L138 60 Z" fill="#ffffff"/>
    <!-- the knot -->
    <path d="M108 38 L148 38 L140 68 L116 68 Z" fill="#3a6ee8"/>
  </g>
  <path d="M84 32 L92 58" stroke="#dfe8f2" stroke-width="4" stroke-linecap="round"/>
  <path d="M172 32 L164 58" stroke="#dfe8f2" stroke-width="4" stroke-linecap="round"/>
  <path d="M116 44 L120 62" stroke="#8fc3ff" stroke-width="4" stroke-linecap="round"/>
</svg>
