<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the cowboy hat. Caramel felt,
       a crown pinched in the middle, a wide brim curled up at both sides,
       a red-brown band with a little gold star.
       Drawn in Lumi's units: inside the group 1 = one pixel of Lumi's
       384 picture, (0, 0) = the top of Lumi's head (the head anchor).
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-cowboyhut.svg public/sprites/wardrobe/cowboyhut.webp 384 -->
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b673"/>
      <stop offset="0.55" stop-color="#d4904c"/>
      <stop offset="1" stop-color="#b06a30"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5a35f"/>
      <stop offset="1" stop-color="#b8723a"/>
    </linearGradient>
    <clipPath id="crown"><path d="M-70 30 C-74 -10 -70 -50 -50 -68 C-36 -80 -18 -74 0 -62 C18 -74 36 -80 50 -68 C70 -50 74 -10 70 30 Z"/></clipPath>
  </defs>
  <g transform="translate(128 136) scale(0.85)">
    <!-- the crown, pinched in the middle -->
    <path d="M-70 30 C-74 -10 -70 -50 -50 -68 C-36 -80 -18 -74 0 -62 C18 -74 36 -80 50 -68 C70 -50 74 -10 70 30 Z" fill="url(#felt)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <g clip-path="url(#crown)">
      <path d="M-48 14 C-54 -20 -50 -46 -38 -60" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.3"/>
      <path d="M70 40 C60 0 62 -40 46 -72 L90 -80 L90 40 Z" fill="#7a3a12" opacity="0.2"/>
    </g>
    <path d="M0 -60 C4 -44 4 -30 0 -18" stroke="#9a5a26" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- the band with a gold star -->
    <path d="M-72 8 Q0 -4 72 8 L72 28 Q0 18 -72 28 Z" fill="#9c3e2a" stroke="#7b4a1e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-62 10 Q0 0 62 10" stroke="#c9644a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M0 2 l3.5 7.5 8 .8 -6 5.5 1.8 8 -7.3 -4.2 -7.3 4.2 1.8 -8 -6 -5.5 8 -.8 z" fill="#ffd23a" stroke="#7b4a1e" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- the wide brim, curled up at the sides -->
    <path d="M-147 -14 C-140 22 -96 52 0 58 C96 52 140 22 147 -14 C147 -20 142 -22 139 -19 C124 2 94 20 60 24 Q0 32 -60 24 C-94 20 -124 2 -139 -19 C-142 -22 -147 -20 -147 -14 Z" fill="url(#brim)" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-122 8 C-104 20 -78 27 -40 31" stroke="#fbd29a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M60 46 C100 40 126 24 138 6" stroke="#8a4c20" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
