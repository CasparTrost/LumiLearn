<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the medal. A blue and red
       ribbon round the neck, a gold medal with a star hanging from it on
       the chest. The middle of the upper edge is the neck.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-medaille.svg public/sprites/wardrobe/medaille.webp 384 -->
  <defs>
    <radialGradient id="gold" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.5" stop-color="#ffcf3a"/>
      <stop offset="1" stop-color="#d98e14"/>
    </radialGradient>
  </defs>
  <g stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- the ribbon: from both sides of the neck down to the medal -->
    <path d="M44 30 L82 30 L136 104 L110 112 Z" fill="#3f8ee8"/>
    <path d="M212 30 L174 30 L120 104 L146 112 Z" fill="#e5483f"/>
  </g>
  <path d="M63 32 L123 106" stroke="#ffffff" stroke-width="6" opacity="0.85"/>
  <path d="M193 32 L133 106" stroke="#ffffff" stroke-width="6" opacity="0.85"/>
  <!-- the ring the medal hangs on -->
  <rect x="112" y="98" width="32" height="18" rx="7" fill="#e6a628" stroke="#7b4a1e" stroke-width="4.5"/>
  <!-- the medal -->
  <circle cx="128" cy="152" r="42" fill="url(#gold)" stroke="#7b4a1e" stroke-width="5"/>
  <circle cx="128" cy="152" r="31" fill="none" stroke="#d98e14" stroke-width="4"/>
  <path d="M128 129 l7.4 15 16.6 2.4 -12 11.7 2.8 16.5 -14.8 -7.8 -14.8 7.8 2.8 -16.5 -12 -11.7 16.6 -2.4 z" fill="#fff3a0" stroke="#b8760e" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M99 137 A33 33 0 0 1 120 119" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>
