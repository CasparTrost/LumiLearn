<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Lumi's wardrobe (src/lib/wardrobe.js): the party hat. A short cone
       with coloured dots and a zigzag edge, a fluffy pompom on the tip.
       Render: node scripts/art/render-svg.mjs scripts/art/schrank-partyhut.svg public/sprites/wardrobe/partyhut.webp 256 -->
  <defs>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd8ff"/>
      <stop offset="0.5" stop-color="#4ab4f0"/>
      <stop offset="1" stop-color="#2f8fd0"/>
    </linearGradient>
    <clipPath id="c"><path d="M60 214 L128 40 L196 214 Q128 230 60 214 Z"/></clipPath>
    <radialGradient id="pom" cx="0.38" cy="0.35" r="0.7"><stop offset="0" stop-color="#fff6a8"/><stop offset="0.7" stop-color="#ffd23a"/><stop offset="1" stop-color="#f0a818"/></radialGradient>
  </defs>
  <path d="M60 214 L128 40 L196 214 Q128 230 60 214 Z" fill="url(#cone)"/>
  <g clip-path="url(#c)">
    <!-- diagonal stripes -->
    <g fill="#ff6fa8">
      <path d="M40 150 L216 80 L216 98 L40 168 Z"/>
      <path d="M40 206 L216 136 L216 154 L40 224 Z"/>
    </g>
    <!-- dots -->
    <circle cx="112" cy="104" r="7" fill="#ffe14d"/><circle cx="146" cy="130" r="7" fill="#ffe14d"/>
    <circle cx="100" cy="176" r="7" fill="#ffffff"/><circle cx="156" cy="190" r="7" fill="#ffe14d"/>
    <circle cx="128" cy="160" r="6" fill="#ffffff"/>
    <!-- light and shade -->
    <path d="M104 196 L128 64" stroke="#ffffff" stroke-width="10" opacity="0.3" stroke-linecap="round"/>
    <path d="M196 214 L128 40 L230 40 L230 230 Z" fill="#14507e" opacity="0.18"/>
  </g>
  <path d="M60 214 L128 40 L196 214 Q128 230 60 214 Z" fill="none" stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round"/>
  <!-- the zigzag paper edge -->
  <path d="M54 208 L66 224 L78 210 L92 226 L106 212 L120 228 L134 212 L148 228 L162 212 L176 226 L190 210 L202 222 L200 206 Q128 222 56 204 Z" fill="#ffe14d" stroke="#7b4a1e" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- pompom -->
  <g stroke="#7b4a1e" stroke-width="5" stroke-linejoin="round">
    <path d="M128 14 C136 10 146 16 148 24 C158 24 162 34 158 40 C164 48 158 58 150 58 C148 66 138 70 130 66 C122 72 110 68 108 60 C98 60 94 50 98 44 C92 36 98 26 106 26 C110 16 120 12 128 14 Z" fill="url(#pom)"/>
  </g>
  <g stroke="#e09410" stroke-width="2.5" stroke-linecap="round" opacity="0.7"><path d="M116 34 l5 5"/><path d="M140 32 l-3 6"/><path d="M144 50 l-6 1"/><path d="M118 52 l4 -5"/></g>
</svg>
