<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Diese Seite verweist auf Dateinamen mit Prüfsumme. Bleibt sie im
         Browser-Zwischenspeicher, zeigt sie nach einem Update auf Dateien, die
         es nicht mehr gibt, und kein Spiel lädt mehr. Die Dateien selbst
         dürfen gern zwischengespeichert bleiben — nur diese Seite nicht. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <title>LumiLearn 🌟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Zum Home-Bildschirm hinzugefügt startet LumiLearn im Vollbild, ohne
         Adressleiste und Tabs, die ein Kind wegtippen könnte -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#8A4F22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LumiLearn" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
